[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eurobiasbench"
version = "0.1.0"
description = "Exploratory EU-grounded evaluation of LLM cultural and normative behavior"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
eurobiasbench = "eurobiasbench.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eurobiasbench = ["data/*.json"]
