name: Python CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: eurobiasbench validate --pilot
      - run: eurobiasbench run --mode mock --limit 2 --repeats 1 --output results/ci
      - run: eurobiasbench report --input results/ci
      - run: eurobiasbench preflight --mode mock --limit 2 --repeats 1
      - run: eurobiasbench run --mode mock --limit 2 --repeats 1 --output results/recovery
      - run: eurobiasbench run --mode mock --limit 2 --repeats 1 --output results/recovery --resume
      - run: eurobiasbench discover --fixture tests/fixtures/discovery_synthetic.json --target 6 --output results/discovery-ci
      - uses: actions/upload-artifact@v4
        with:
          name: eurobiasbench-discovery-synthetic-smoke
          path: results/discovery-ci/
          retention-days: 7
