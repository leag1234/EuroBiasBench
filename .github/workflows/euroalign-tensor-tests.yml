name: EuroAlign CPU tensor patch checks
on:
  push:
    branches: [feature/euroalign-14b-poc]
  pull_request:
    paths:
      - 'src/eurobiasbench/euroalign_*.py'
      - 'tests/test_euroalign_*.py'
jobs:
  torch-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight local project
        run: python -m pip install -e .
      - name: Install CPU-only PyTorch (no GPU or external LLM)
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0+cpu'
      - name: Verify tensor edit exact restoration and offline POC guards
        run: python -m unittest discover -s tests -p 'test_euroalign_*.py' -v
