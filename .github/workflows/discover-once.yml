name: Manual bounded Wikimedia discovery
on:
  workflow_dispatch:
    inputs:
      target:
        description: Maximum number of subjects (1-100)
        required: true
        default: '100'
      max_requests:
        description: Maximum Wikimedia HTTP requests (1-90)
        required: true
        default: '90'
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Bound and validate request parameters
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          [[ "$TARGET" =~ ^[0-9]+$ ]] && (( TARGET >= 1 && TARGET <= 100 ))
          [[ "$MAX_REQUESTS" =~ ^[0-9]+$ ]] && (( MAX_REQUESTS >= 1 && MAX_REQUESTS <= 90 ))
      - name: Screen Wikimedia topics (no LLM calls)
        env:
          TARGET: ${{ inputs.target }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: eurobiasbench discover --live --target "$TARGET" --max-requests "$MAX_REQUESTS" --output results/discovery-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eurobiasbench-discovery-screening-only
          path: results/discovery-run/
          if-no-files-found: warn
          retention-days: 14
